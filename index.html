<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Unit Directory</title>
<style>
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --ink: #1c2530;
    --muted: #5d6b7a;
    --line: #d9e0e7;
    --accent: #1f4e79;
    --active-bg: #dcf3e3;
    --active-ink: #176534;
    --inactive-bg: #e6e8eb;
    --inactive-ink: #566170;
    --danger: #a32d2d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a20;
      --surface: #1e252d;
      --ink: #e8edf2;
      --muted: #9aa8b6;
      --line: #313b46;
      --accent: #6aa6dc;
      --active-bg: #1d4429;
      --active-ink: #8fe0a8;
      --inactive-bg: #333b45;
      --inactive-ink: #aab4bf;
      --danger: #f08a8a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 820px; margin: 0 auto; }
  h1 { margin: 0 0 1.5rem; font-size: 2rem; letter-spacing: -0.01em; }
  section {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }
  h2 { margin: 0 0 1rem; font-size: 1.05rem; }
  form { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; }
  label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.85rem; color: var(--muted); flex: 1 1 160px; }
  input, select, button { font: inherit; }
  input, select {
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
  }
  button {
    padding: 0.55rem 1rem;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button.primary { color: #10202e; } }
  button.secondary { background: transparent; color: var(--accent); }
  button.small { padding: 0.3rem 0.65rem; font-size: 0.85rem; }
  button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .toolbar h2 { margin: 0; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.7rem 0.6rem; border-bottom: 1px solid var(--line); }
  th { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.82rem; font-weight: 600; }
  .badge.active { background: var(--active-bg); color: var(--active-ink); }
  .badge.inactive { background: var(--inactive-bg); color: var(--inactive-ink); }
  .actions { display: flex; gap: 0.4rem; }
  .empty { text-align: center; color: var(--muted); padding: 1.5rem 0.6rem; }
</style>
</head>
<body>
<main>
  <h1>IT Unit Directory</h1>

  <section aria-labelledby="add-title">
    <h2 id="add-title">Add staff member</h2>
    <form id="staff-form" novalidate>
      <label>Full name
        <input type="text" id="name" placeholder="e.g. Maria Santos">
      </label>
      <label>Role
        <input type="text" id="role" placeholder="e.g. Network Engineer">
      </label>
      <label>Status
        <select id="status">
          <option value="Inactive" selected>Inactive</option>
          <option value="Active">Active</option>
        </select>
      </label>
      <button type="submit" class="primary">Add staff member</button>
    </form>
  </section>

  <section aria-labelledby="list-title">
    <div class="toolbar">
      <h2 id="list-title">Staff</h2>
      <button type="button" id="toggle-btn" class="secondary" aria-pressed="false">Hide inactive staff</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Full name</th><th>Role</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="staff-body"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
  // ---- Data ----
  let staff = [
  { id: 1, name: "Rabbit", role: "Network Engineer", status: "Inactive" },
  { id: 2, name: "Whale", role: "Systems Administrator", status: "Inactive" },
  { id: 3, name: "Tom", role: "Technician", status: "Inactive" },
  { id: 4, name: "Dolphin", role: "Security Analyst", status: "Inactive" },
  { id: 5, name: "Elephant", role: "Database Administrator", status: "Inactive" }
];
  let nextId = staff.length + 1;
  let hideInactive = false;

  // ---- DOM references ----
  const form = document.getElementById("staff-form");
  const nameInput = document.getElementById("name");
  const roleInput = document.getElementById("role");
  const statusInput = document.getElementById("status");
  const tbody = document.getElementById("staff-body");
  const toggleBtn = document.getElementById("toggle-btn");

  // ---- Rendering ----
  function render() {
    tbody.innerHTML = "";

    // Show/hide toggle: filter out inactive staff when hidden
    const visible = hideInactive
      ? staff.filter(function (s) { return s.status === "Active"; })
      : staff;

    if (visible.length === 0) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 4;
      td.className = "empty";
      td.textContent = "No staff to show. Add a staff member above.";
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }

    visible.forEach(function (member) {
      const tr = document.createElement("tr");

      const nameTd = document.createElement("td");
      nameTd.textContent = member.name;

      const roleTd = document.createElement("td");
      roleTd.textContent = member.role;

      // Conditional badge: green for Active, gray for Inactive
      const statusTd = document.createElement("td");
      const badge = document.createElement("span");
      badge.className = "badge " + (member.status === "Active" ? "active" : "inactive");
      badge.textContent = member.status;
      statusTd.appendChild(badge);

      const actionsTd = document.createElement("td");
      const wrap = document.createElement("div");
      wrap.className = "actions";

      const toggleStatus = document.createElement("button");
      toggleStatus.type = "button";
      toggleStatus.className = "small secondary";
      toggleStatus.textContent = member.status === "Active" ? "Set inactive" : "Set active";
      toggleStatus.addEventListener("click", function () {
        member.status = member.status === "Active" ? "Inactive" : "Active";
        render();
      });

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "small danger";
      remove.textContent = "Remove";
      remove.addEventListener("click", function () {
        staff = staff.filter(function (s) { return s.id !== member.id; });
        render();
      });

      wrap.appendChild(toggleStatus);
      wrap.appendChild(remove);
      actionsTd.appendChild(wrap);

      tr.appendChild(nameTd);
      tr.appendChild(roleTd);
      tr.appendChild(statusTd);
      tr.appendChild(actionsTd);
      tbody.appendChild(tr);
    });
  }

  // ---- Form validation + add ----
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    const name = nameInput.value.trim();
    const role = roleInput.value.trim();

    if (name === "" || role === "") {
      alert("Please enter both a full name and a role before adding a staff member.");
      (name === "" ? nameInput : roleInput).focus();
      return;
    }

    staff.push({ id: nextId++, name: name, role: role, status: "Inactive" });
    form.reset();
    nameInput.focus();
    render();
  });

  // ---- Show/hide inactive staff ----
  toggleBtn.addEventListener("click", function () {
    hideInactive = !hideInactive;
    toggleBtn.textContent = hideInactive ? "Show inactive staff" : "Hide inactive staff";
    toggleBtn.setAttribute("aria-pressed", String(hideInactive));
    render();
  });

  render();
</script>
</body>
</html>
